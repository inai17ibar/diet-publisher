name: story-publish

on:
  schedule:
    # JSTで 08:00 / 13:00 / 22:00 の1日3回（Railwayの課金が稼働時間ベースのため、
    # サービスを起こす回数を絞っている）。投稿判断はサーバー側が記録の状態を
    # 見て行うので、何度呼んでも二重投稿はしない。
    #   22:00 … 当日の3食がそろっていれば当日分（/story/publish は21時以降に当日を見る）
    #   08:00 … 夜遅くに記録した日・翌朝に前日分を入力した日の救済
    #   13:00 … 翌日の昼に前日分を入力した場合の救済
    - cron: "0 23,4,13 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # RailwayのServerless(スリープ)を有効にしているため、最初の1発は
      # コールドスタートを踏む。起動待ちで落とさないようリトライと長めの
      # タイムアウトを付ける。週次の読み取り再試行はAPI内で行う。
      - name: Post story if there is something to post
        run: |
          curl -sS --fail -X POST \
            --max-time 180 --retry 3 --retry-delay 10 --retry-connrefused \
            -H "X-API-Key: ${{ secrets.DIET_PUBLISHER_API_KEY }}" \
            "https://chatgpt-diet-app-production.up.railway.app/api/v1/story/publish"
          echo

      # 投稿成功後の応答喪失・台帳保存失敗では再送が二重投稿になり得るため、
      # 週次POST全体は再試行しない。失敗時は安全な段階情報を本文に出す。
      # 週次振り返りも同じcronに相乗りさせる。投稿すべき週かどうかは
      # サーバー側が判断する（日曜の3食がそろった週だけ投稿する）
      - name: Post weekly review if the week is done
        run: |
          curl -sS --fail-with-body -X POST \
            --max-time 180 \
            -H "X-API-Key: ${{ secrets.DIET_PUBLISHER_API_KEY }}" \
            "https://chatgpt-diet-app-production.up.railway.app/api/v1/story/publish-weekly"
          echo
