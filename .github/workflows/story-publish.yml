name: story-publish

on:
  schedule:
    # 21:30 JST (12:30 UTC) — 夕食記録後を想定
    - cron: "30 12 * * *"
    # 23:30 JST (14:30 UTC) — 1回目に記録が無かった場合の再試行（冪等なので二重投稿はしない）
    - cron: "30 14 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Post today's story
        run: |
          curl -sf -X POST \
            -H "X-API-Key: ${{ secrets.DIET_PUBLISHER_API_KEY }}" \
            "https://chatgpt-diet-app-production.up.railway.app/api/v1/story/publish"
