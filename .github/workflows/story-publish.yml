name: story-publish

on:
  schedule:
    # JSTで 07:00 / 10:00 / 13:00 / 16:00 / 19:00 / 22:00 の1日6回。
    # 投稿判断はサーバー側（/story/publish）が記録の状態を見て行うため、
    # 何度呼んでも二重投稿はしない。食事の入力時刻がまちまちでも、
    # 当日夜(22時)にも翌朝(7時)にも拾える。
    - cron: "0 22,1,4,7,10,13 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Post story if there is something to post
        run: |
          curl -sf -X POST \
            -H "X-API-Key: ${{ secrets.DIET_PUBLISHER_API_KEY }}" \
            "https://chatgpt-diet-app-production.up.railway.app/api/v1/story/publish"
